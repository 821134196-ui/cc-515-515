<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毕业生档案转递系统</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>

  <span class="role-badge" id="roleBadge"></span>
